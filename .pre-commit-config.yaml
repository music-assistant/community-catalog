repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false

      - id: codespell
        name: codespell
        entry: uv run codespell
        language: system
        types: [text]
        exclude: ^(uv\.lock|LICENSE)$

      # every file of the registry is valid and the index files are up to date
      - id: validate
        name: validate the registry
        entry: uv run python -m registry validate
        language: system
        pass_filenames: false
        files: ^(providers/|site/|registry/|channels\.json|reserved_domains\.json)
