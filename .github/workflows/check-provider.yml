name: Check a provider

# A reusable workflow for the repository of a community provider: it runs the manifest,
# dependency and load checks of the community catalog on the provider folder, in the server
# image of the channel you choose. Call it from a workflow on your pull requests:
#
#   jobs:
#     catalog:
#       uses: music-assistant/community-catalog/.github/workflows/check-provider.yml@main
#       with:
#         folder: my_provider
#         channel: nightly

on:
  workflow_call:
    inputs:
      folder:
        description: The provider folder in your repository, named after its domain or provider
        required: true
        type: string
      channel:
        description: The channel to check against (nightly by default), as in channels.json
        required: false
        type: string
        default: ""
      # the same as channel, for the workflows that pass it under this name
      server-line:
        description: The channel to check against, when channel is not given
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  check:
    name: Community catalog checks on ${{ inputs.channel || inputs.server-line || 'nightly' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: provider
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: music-assistant/community-catalog
          ref: main
          path: catalog
          persist-credentials: false
      - name: Find the server image
        id: image
        env:
          CHANNEL: ${{ inputs.channel || inputs.server-line || 'nightly' }}
        run: |
          image=$(jq -r --arg channel "$CHANNEL" '.channels[$channel].image // empty' \
            catalog/channels.json)
          if [ -z "$image" ]; then
            echo "::error::$CHANNEL is not a channel of the community catalog"
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Run the checks in the server image
        env:
          FOLDER: ${{ inputs.folder }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker run --rm --pull always --platform linux/amd64 --entrypoint python \
            --volume "$PWD/catalog:/catalog:ro" --volume "$PWD/provider:/provider:ro" \
            --workdir /catalog "$IMAGE" \
            -m registry --root /catalog check-folder "/provider/$FOLDER"
