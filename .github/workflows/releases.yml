name: Releases

# Turns the releases of the providers into version files with check results. The jobs share only
# files: fetch reads GitHub and plans the checks, check runs provider code in the server image of
# each line without any token, apply records the results and pushes, report writes an issue per
# failure. Only a run on main records or reports anything.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: releases
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch new releases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      lines: ${{ steps.lines.outputs.lines }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --locked --no-dev
      - name: Fetch new releases and the archives to check, and plan the checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-dev python -m registry fetch
      # the lines that are tested, each with its server image
      - name: List the server lines
        id: lines
        run: |
          lines=$(jq -c '[.lines | to_entries[] | select(.value.frozen != true)
            | {line: .key, image: .value.image}]' server_lines.json)
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
      # the code and files the check needs; the check job has no checkout and no token
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fetched
          path: |
            registry/
            scripts/
            providers/
            server_lines.json
            reserved_domains.json
            work/
          if-no-files-found: error
          retention-days: 7

  check:
    name: Check on ${{ matrix.line }}
    needs: fetch
    if: needs.fetch.outputs.lines != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.fetch.outputs.lines) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fetched
          path: catalog
      # provider code runs only in containers, one per version and stage, without the job's
      # environment; only the results file the script asks each container for is kept
      - name: Run the checks in the server image
        env:
          IMAGE: ${{ matrix.image }}
          LINE: ${{ matrix.line }}
        run: bash catalog/scripts/check-line.sh catalog "$LINE" "$IMAGE" results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.line }}
          path: results/
          if-no-files-found: ignore
          retention-days: 7

  apply:
    name: Record the results
    needs: [fetch, check]
    # also when a line could not be checked: new version files and refusals are kept
    if: ${{ !cancelled() && needs.fetch.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # holds the key of the app, which only a run on main gets
    environment: releases
    permissions:
      contents: read
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MUSIC_ASSISTANT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MUSIC_ASSISTANT_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --locked --no-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fetched
          path: ${{ runner.temp }}/fetched
      # only the files of the providers and the plan; the code that runs here is the checked out
      # code
      - name: Take the version files, refusals and plan of the fetch step
        run: |
          if [ -d "$RUNNER_TEMP/fetched/providers" ]; then
            rm -rf providers
            cp -R "$RUNNER_TEMP/fetched/providers" providers
          fi
          mkdir work
          cp "$RUNNER_TEMP/fetched/work/plan.json" work/plan.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          merge-multiple: true
          path: results
      # the results files are data from containers that ran provider code; only those the plan
      # names are read, and only as data
      - run: uv run --no-dev python -m registry apply-results results
      - run: uv run --no-dev python -m registry validate
      # the push of the app starts the Publish workflow when an index changed
      - name: Commit and push
        env:
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git add providers site
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          user_id=$(gh api "/users/$APP_SLUG%5Bbot%5D" --jq '.id')
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m "Record new releases and check results"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" HEAD:main

  report:
    name: Report failures
    needs: [fetch, check, apply]
    if: ${{ !cancelled() && needs.apply.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # holds the token for the issues, which only a run on main gets
    environment: releases
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --locked --no-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fetched
          path: ${{ runner.temp }}/fetched
      - name: Take the files of the fetch step
        run: |
          if [ -d "$RUNNER_TEMP/fetched/providers" ]; then
            rm -rf providers
            cp -R "$RUNNER_TEMP/fetched/providers" providers
          fi
          cp -R "$RUNNER_TEMP/fetched/work" work
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          merge-multiple: true
          path: results
      - run: uv run --no-dev python -m registry report results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issues
          path: work/issues/
          if-no-files-found: ignore
          retention-days: 30
      # switched on with the repository variable POST_ISSUES once REPORT_TOKEN is set
      - name: Open the issues
        if: vars.POST_ISSUES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: uv run --no-dev python -m registry post-issues
