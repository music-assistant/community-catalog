name: Releases

# Turns the releases of the providers into version files with check results. The jobs share only
# files: fetch reads GitHub and plans the checks, check runs provider code in the server image of
# each channel without any token, apply records the results, reads the new versions against the
# catalog rules with Claude and pushes, report keeps one issue per provider with failures on this
# repository. Only a run on main records or reports anything.

on:
  schedule:
    # after the nightly of the server, so the nightly channel is checked on tonight's image
    - cron: "17 6 * * *"
      timezone: "Europe/Amsterdam"
  workflow_dispatch:

permissions: {}

concurrency:
  group: releases
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch new releases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      channels: ${{ steps.channels.outputs.channels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - run: uv sync --locked --no-dev
      - name: Fetch new releases and the archives to check, and plan the checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-dev python -m registry fetch
      # the channels that are tested, each with its server image
      - name: List the channels
        id: channels
        run: |
          channels=$(jq -c '[.channels | to_entries[] | select(.value.frozen != true)
            | {channel: .key, image: .value.image}]' channels.json)
          echo "channels=$channels" >> "$GITHUB_OUTPUT"
      # the code and files the check needs; the check job has no checkout and no token
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fetched
          path: |
            registry/
            scripts/
            providers/
            channels.json
            reserved_domains.json
            work/
          if-no-files-found: error
          retention-days: 7

  check:
    name: Check on ${{ matrix.channel }}
    needs: fetch
    if: needs.fetch.outputs.channels != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.fetch.outputs.channels) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fetched
          path: catalog
      # provider code runs only in containers, one per version and stage, without the job's
      # environment; only the results file the script asks each container for is kept
      - name: Run the checks in the server image
        env:
          IMAGE: ${{ matrix.image }}
          CHANNEL: ${{ matrix.channel }}
        run: bash catalog/scripts/check-channel.sh catalog "$CHANNEL" "$IMAGE" results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.channel }}
          path: results/
          if-no-files-found: ignore
          retention-days: 7

  apply:
    name: Record the results
    needs: [fetch, check]
    # also when a channel could not be checked: new version files and refusals are kept
    if: ${{ !cancelled() && needs.fetch.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # the read step stops after four hours at the latest; the other steps take minutes
    timeout-minutes: 270
    # holds the key of the app and the ids of the reading, which only a run on main gets
    environment: releases
    permissions:
      contents: read
      # the identity token of the job, which the reading exchanges for a token of the Claude API
      id-token: write
    outputs:
      # the version files of this run are on main, also when the reading failed
      recorded: ${{ steps.push.outputs.recorded }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - run: uv sync --locked --no-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fetched
          path: ${{ runner.temp }}/fetched
      # only the files of the providers, the plan and the archives, which are read as data only;
      # the code that runs here is the checked out code
      - name: Take the version files, refusals, plan and archives of the fetch step
        run: |
          if [ -d "$RUNNER_TEMP/fetched/providers" ]; then
            rm -rf providers
            cp -R "$RUNNER_TEMP/fetched/providers" providers
          fi
          cp -R "$RUNNER_TEMP/fetched/work" work
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          merge-multiple: true
          path: results
      # the results files are data from containers that ran provider code; only those the plan
      # names are read, and only as data
      - run: uv run --no-dev python -m registry apply-results results
      # on trial: a reading that does not finish fails the run at its end, after the push, so the
      # check results are recorded and reported all the same
      - id: read
        name: Read the new versions against the catalog rules
        continue-on-error: true
        timeout-minutes: 240
        env:
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: uv run --no-dev python -m registry read
      - run: uv run --no-dev python -m registry validate
      # the token of the app lives an hour, so it is made once the reading is done
      - id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.MUSIC_ASSISTANT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MUSIC_ASSISTANT_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      # the push of the app starts the Publish workflow when an index changed
      - id: push
        name: Commit and push
        env:
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # a folder that does not exist yet (no provider admitted) is not a pathspec git accepts
          for path in providers site; do
            if [ -e "$path" ] || [ -n "$(git ls-files -- "$path")" ]; then
              git add "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            user_id=$(gh api "/users/$APP_SLUG%5Bbot%5D" --jq '.id')
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
            git commit -m "Record new releases and check results"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" HEAD:main
          fi
          echo "recorded=true" >> "$GITHUB_OUTPUT"
      # what the reading found, for the issues of the report; only counts reach the log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readings
          path: work/readings.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Fail when the reading did not finish
        if: steps.read.outcome != 'success'
        run: |
          echo "::error::The reading of the new versions did not finish; its step says why."
          exit 1

  report:
    name: Report failures
    needs: [fetch, check, apply]
    if: ${{ !cancelled() && needs.apply.outputs.recorded == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # to open, comment on and close the issues of the pipeline on this repository
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - run: uv sync --locked --no-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fetched
          path: ${{ runner.temp }}/fetched
      # only the files of the providers and the work folder; the code that runs here is the
      # checked out code
      - name: Take the files of the fetch step
        run: |
          if [ -d "$RUNNER_TEMP/fetched/providers" ]; then
            rm -rf providers
            cp -R "$RUNNER_TEMP/fetched/providers" providers
          fi
          cp -R "$RUNNER_TEMP/fetched/work" work
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          merge-multiple: true
          path: results
      # the readings of the apply job, when it read anything
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: readings
          merge-multiple: true
          path: work
      - run: uv run --no-dev python -m registry report results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issues
          path: work/issues/
          if-no-files-found: ignore
          retention-days: 30
      - name: Open, add to or close the issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: uv run --no-dev python -m registry post-issues --repository "$REPOSITORY"
