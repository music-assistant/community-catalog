name: Submit a provider
description: Ask for your provider to be listed in the community catalog. The checks run by themselves.
title: "Submit a provider"
labels: [submission]
body:
  - type: markdown
    attributes:
      value: >-
        Before you submit, read [Getting your provider listed](https://github.com/music-assistant/community-catalog#getting-your-provider-listed).
        The checks run as soon as you submit and report in a comment on this issue. When they
        pass, a pull request that adds your provider follows, and a registry maintainer decides
        on it. Leave the rest of the issue as the form writes it: edit only the fields.
  - type: input
    id: repository
    attributes:
      label: Repository
      description: Your repository on GitHub, as `owner/name` or its github.com address.
      placeholder: someone/ma-sample-music
    validations:
      required: true
  - type: input
    id: folder
    attributes:
      label: Folder
      description: >-
        Only when the checks cannot find it: the path of the provider folder in your repository.
        Without it, they take `provider`, or else the one top-level folder with a `manifest.json`.
      placeholder: providers/sample_music
  - type: input
    id: tag-prefix
    attributes:
      label: Tag prefix
      description: >-
        Only for a repository with several providers: what the release tags of this one start
        with.
      placeholder: sample_music-
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before you submit
      options:
        - label: I own this repository, or I am a code owner in the manifest of its provider.
          required: true
        - label: >-
            I have read the [rules of the community catalog](https://github.com/music-assistant/.github/blob/main/COMMUNITY_CATALOG_RULES.md).
          required: true
